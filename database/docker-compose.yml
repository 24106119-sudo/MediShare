version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: medishare_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medishare_db
      MYSQL_USER: medishare_user
      MYSQL_PASSWORD: medishare_password
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
